[metadata]
name = modbus_event_connect
version = attr: modbus_event_connect.__version__
author = HairingX
license = MIT
description = Event-driven, async Modbus client: describe a device once, subscribe to its values, and be told when they change - over Modbus TCP or micro_nabto.
keywords = modbus, modbus-tcp, micro_nabto, nabto, asyncio, iot
url = https://github.com/HairingX/modbus_event_connect
project_urls =
    Source = https://github.com/HairingX/modbus_event_connect
    Issues = https://github.com/HairingX/modbus_event_connect/issues
    Releases = https://github.com/HairingX/modbus_event_connect/releases
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Framework :: AsyncIO
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Software Development :: Libraries
    Topic :: System :: Hardware
    Typing :: Typed

[options]
python_requires = >=3.12
packages = find:
package_dir =
    =src
zip_safe = False
install_requires =
    pymodbus >=3.6,<4

[options.packages.find]
where=src

[options.package_data]
# PEP 561: tells a type checker the package ships its own types, so a consumer does not have
# to silence the import.
modbus_event_connect = py.typed

