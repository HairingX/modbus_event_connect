name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- #$NUMBER $TITLE @$AUTHOR'
sort-direction: ascending
categories:
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'

  - title: '🛠 Breaking Changes'
    when:
      label: 'breaking-change'

  - title: '🚀 Features'
    when:
      labels:
        - 'feature request'
        - 'enhancement'

  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'

  - title: '🧰 Maintenance'
    when:
      label: 'chore'

  - title: ':package: Dependencies'
    when:
      label: 'dependencies'

  # The next version: a major or minor bump by label, a patch otherwise.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
template: |
  ## Changes
  $CHANGES
autolabeler:
  - label: 'bug'
    branch:
      - '/fix\/.+/'
  - label: 'feature request'
    branch:
      - '/feature\/.+/'
