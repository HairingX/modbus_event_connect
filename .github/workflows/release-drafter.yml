name: Release Drafter

# Keeps a draft release with the notes of every pull request merged since the last release.
# The draft is never published by hand: the Release workflow takes its notes and publishes.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  update_release_draft:
    name: Update the release draft
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Draft the release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  autolabel_pr:
    name: Label the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels
        uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
