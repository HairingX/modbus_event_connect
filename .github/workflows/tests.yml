name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # The Release workflow runs these on the exact commit it is about to release.
  workflow_call:
    inputs:
      ref:
        description: The commit to test.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the test tools
        run: python -m pip install . -r requirements-test.txt


      - name: Type check (pyright strict)
        run: |
          pyright
          pyright -p .github/scripts

      # Live tests need a real device; they skip themselves without one, and are excluded here.
      - name: Test
        run: |
          python -m pytest -m "not live" -q -o log_cli=false
          python -m pytest .github/scripts -q -o log_cli=false
