name: Release

# Run this from the Actions tab. Never publish the draft release by hand: that creates the tag
# at whatever main points to, before the version in the package has been set.
#
# Everything runs in one direction, and nothing leaves the runner until it has been checked:
# resolve the version -> test the exact commit -> set the version, build, and check that the
# built package says that version -> push the version commit and the tag together -> PyPI ->
# GitHub release. If main moves while this runs, the push is refused and nothing is published.
#
# The file name matters: PyPI trusted publishing is bound to this repository, this workflow
# file and the pypi environment. A release cut from any other file never reaches PyPI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, in canonical PEP 440 form without a v: 1.2.3, or a pre-release
          such as 1.2.3rc1. Leave empty to take the version of the newest draft release.
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: modbus_event_connect
  VERSION_FILE: src/modbus_event_connect/__init__.py

jobs:
  prepare:
    name: Resolve the version
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are listed only to those who can push.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Refuse to run from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          # The tests and this workflow are taken from the branch it runs from.
          echo "::error::Run the release from main, not $GITHUB_REF_NAME."
          exit 1

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python -m pip install packaging==26.3

      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            tag_name=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq '[.[] | select(.draft)] | sort_by(.created_at) | reverse | .[0].tag_name // empty')
            if [[ -z "$tag_name" ]]; then
              echo "::error::No draft release to take the version from. Supply a version."
              exit 1
            fi
            version="${tag_name#v}"
            echo "Version from the newest draft: $version"
          fi
          python .github/scripts/release_version.py check "$version" | tee -a "$GITHUB_OUTPUT"

      - name: Refuse a version already tagged or on PyPI
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" > /dev/null; then
            echo "::error::The tag $TAG already exists. Pick a new version."
            exit 1
          fi
          # PyPI never takes a version twice, so fail here rather than after tagging.
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/$VERSION/json")
          if [[ "$status" == "200" ]]; then
            echo "::error::$PACKAGE $VERSION is already on PyPI. Pick a new version."
            exit 1
          fi

      - name: Record the commit to release
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    name: Set the version, build and push the tag
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the build tools
        run: python -m pip install packaging==26.3 build==1.6.1

      - name: Set the version, and commit it if it changed
        run: |
          python .github/scripts/release_version.py write "$VERSION" "$VERSION_FILE"
          changed=$(git status --porcelain)
          if [[ -n "$changed" && "$changed" != " M $VERSION_FILE" ]]; then
            echo "::error::Setting the version changed more than $VERSION_FILE:"
            echo "$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$changed" ]]; then
            git commit -q -am "Release $TAG"
          else
            echo "$VERSION_FILE already says $VERSION"
          fi
          git tag -a "$TAG" -m "Release $TAG"

      - name: Build
        run: python -m build

      - name: Check the built package says this version
        run: |
          shopt -s nullglob
          wheels=(dist/*-"$VERSION"-*.whl)
          sdists=(dist/*-"$VERSION".tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "::error::Expected one wheel and one sdist for $VERSION. dist/ holds:"
            ls -1 dist/
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check/bin/pip" install -q "${wheels[0]}"
          "$RUNNER_TEMP/check/bin/python" - <<'PY'
          import importlib, importlib.metadata, os, sys
          package, version = os.environ["PACKAGE"], os.environ["VERSION"]
          found = importlib.import_module(package).__version__, importlib.metadata.version(package)
          if found != (version, version):
              sys.exit(f"::error::the built package says __version__={found[0]}, metadata={found[1]}, not {version}")
          print(f"{package} {version}: __version__ and metadata agree")
          PY

      - name: Push the version commit and the tag together
        run: |
          # Atomic, and main only fast-forwards from the tested commit: if main moved, or either
          # ref is refused, neither is pushed.
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$TAG"

      - name: Keep the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Mandatory for trusted publishing.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/modbus_event_connect
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Publish the GitHub release
    needs: [prepare, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Take the notes from the newest draft, and publish
        run: |
          draft_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.draft)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [[ -n "$draft_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.body' > notes.md
          else
            echo "No draft release; publishing without notes."
            : > notes.md
          fi
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file notes.md "${flags[@]}"
          if [[ -n "$draft_id" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$draft_id"
          fi
